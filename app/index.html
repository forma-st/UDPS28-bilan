<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche Bilan UDPS</title>
<meta name="theme-color" content="#173a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiche Bilan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="topwrap" id="topwrap">
<header class="topbar">
  <button class="iconbtn" id="btnBack" hidden aria-label="Retour à la liste">&#8592;</button>
  <img class="tb-logo" src="assets/logo-anps.png" alt="Association Nationale des Premiers Secours">
  <div class="tb-title">
    <strong id="tbTitle">Fiches bilan</strong>
    <span id="tbSub" class="tb-sub"></span>
  </div>
  <span id="netState" class="net" title="État réseau"></span>
  <button class="iconbtn" id="btnSettings" aria-label="Réglages">&#9881;</button>
</header>

<div id="alertBar" class="alertbar" hidden>
  <strong>Détresse vitale identifiée</strong> · transmettre le bilan (SAMU 15 / régulation)
</div>
</div>

<main id="app">
  <!-- LISTE -->
  <section id="viewList" class="view">
    <div class="list-actions">
      <button class="btn primary big" id="btnNew">+ Nouvelle fiche</button>
    </div>
    <div class="list-filter">
      <input type="search" id="search" placeholder="Rechercher (n°, nom, date…)" aria-label="Rechercher">
    </div>
    <ul id="ficheList" class="fiche-list"></ul>
    <p id="emptyList" class="empty" hidden>Aucune fiche sur cet appareil. Touchez « Nouvelle fiche » pour démarrer un bilan.</p>
    <div id="outboxInfo" class="outbox" hidden></div>
  </section>

  <!-- EDITION -->
  <section id="viewEdit" class="view" hidden>
    <nav class="secnav" id="secNav" aria-label="Sections"></nav>
    <form id="ficheForm" autocomplete="off" novalidate></form>
    <div class="actions-bar">
      <button type="button" class="btn" id="btnPdf">Exporter PDF</button>
      <button type="button" class="btn" id="btnSend">Envoyer (API)</button>
      <button type="button" class="btn" id="btnJson">Export JSON</button>
      <button type="button" class="btn primary" id="btnClose">Clôturer la fiche</button>
      <button type="button" class="btn danger ghost" id="btnDelete">Supprimer</button>
    </div>
  </section>

  <!-- REGLAGES -->
  <section id="viewSettings" class="view" hidden></section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <p id="modalText"></p>
    <div class="modal-actions">
      <button class="btn" id="modalNo">Annuler</button>
      <button class="btn danger" id="modalYes">Confirmer</button>
    </div>
  </div>
</div>
<div id="busy" class="busy" hidden><div class="spinner"></div><span id="busyText">Génération du PDF…</span></div>

<script src="js/vendor/pdf-lib.min.js"></script>
<script src="js/schema.js"></script>
<script src="js/template-map.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
</body>
</html>
