# Construit l'APK Android signé.
# - à chaque push sur main : l'APK est disponible dans l'onglet Actions (artefact "apk") ;
# - à chaque tag v* (ex. v1.0.1) : l'APK est joint à une Release GitHub.
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   ANDROID_KEYSTORE_BASE64  : contenu du fichier .jks encodé en base64
#   ANDROID_KEYSTORE_PASSWORD: mot de passe du keystore (et de la clé)
#   ANDROID_KEY_ALIAS        : alias de la clé (fichebilan)
name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Clé de signature
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::Secrets de signature absents : APK non signé"; exit 0; fi
          mkdir -p signing
          echo "$KS" | base64 -d > signing/fiche-bilan-release.jks
          printf "storeFile=../../signing/fiche-bilan-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$PW" "$ALIAS" "$PW" > signing/keystore.properties
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: |
          f=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$f" "FicheBilanUDPS-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: 'FicheBilanUDPS-*.apk' }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: 'FicheBilanUDPS-*.apk' }
